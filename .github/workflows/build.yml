name: Build StockFlow APK

on:
  push:
    branches: [ main, master ] # <-- Ini yang membuatnya berjalan otomatis
  workflow_dispatch: # Tetap disediakan jika kamu ingin jalankan manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Generate Android Folder
        working-directory: ./mobile
        run: flutter create . --project-name stock_app --platforms android

      - name: Generate Keystore
        working-directory: ./mobile/android
        run: |
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass password123 -keypass password123 -dname "CN=StockFlow, OU=Dev, O=StockFlow, L=City, S=State, C=ID"
          echo "storePassword=password123" > key.properties
          echo "keyPassword=password123" >> key.properties
          echo "keyAlias=release" >> key.properties
          echo "storeFile=release-key.jks" >> key.properties

      - name: Get Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
