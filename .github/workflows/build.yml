name: Build StockFlow APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 1. Buat folder android dari nol
      - name: Generate Android Folder
        working-directory: ./mobile
        run: flutter create . --project-name stock_app --platforms android

      # 2. Ubah Nama Aplikasi & Application ID
      - name: Rename App to StockFlow
        working-directory: ./mobile/android
        run: |
          sed -i 's/android:label="stock_app"/android:label="StockFlow"/' app/src/main/AndroidManifest.xml
          sed -i 's/namespace "com.example.stock_app"/namespace "com.stockflow.app"/' app/build.gradle
          sed -i 's/applicationId "com.example.stock_app"/applicationId "com.stockflow.app"/' app/build.gradle
          rm -rf app/src/main/kotlin/com/example/stock_app
          mkdir -p app/src/main/kotlin/com/stockflow/app
          cat > app/src/main/kotlin/com/stockflow/app/MainActivity.kt << 'EOF'
          package com.stockflow.app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity() {
          }
          EOF

      # 3. Timpa build.gradle dengan konfigurasi Release
      - name: Inject Release Signing
        working-directory: ./mobile/android
        run: |
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass password123 -keypass password123 -dname "CN=StockFlow, OU=Dev, O=StockFlow, L=City, S=State, C=ID"
          echo "storePassword=password123" > key.properties
          echo "keyPassword=password123" >> key.properties
          echo "keyAlias=release" >> key.properties
          echo "storeFile=release-key.jks" >> key.properties
          cat > app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
          }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
          def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android {
              namespace "com.stockflow.app"
              compileSdkVersion flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }
              defaultConfig {
                  applicationId "com.stockflow.app"
                  minSdkVersion flutter.minSdkVersion
                  targetSdkVersion flutter.targetSdkVersion
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              packagingOptions {
                  resources {
                      excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/9/module-info.class']
                  }
              }
          }
          flutter {
              source '../..'
          }
          EOF

      # 4. SETUP MAVEN MIRROR & ANDROID X (Mengatasi Error 429 & AndroidX)
      - name: Setup Maven Mirror and AndroidX
        working-directory: ./mobile/android
        run: |
          # Membuat file init.gradle untuk mirror
          cat > init.gradle << 'EOF'
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  }
              }
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
              }
          }
          EOF
          # TAMBAHKAN BARIS INI UNTUK MEMAKSA ANDROID X AKTIF
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" > gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Get Dependencies
        working-directory: ./mobile
        run: flutter pub get

      # 5. Cek Debug
      - name: Check Debug Build
        working-directory: ./mobile
        run: flutter build apk --debug -Pandroid.initScript=android/init.gradle

      # 6. Hapus file Debug
      - name: Remove Debug APK
        working-directory: ./mobile
        run: rm -f build/app/outputs/flutter-apk/app-debug.apk

      # 7. Build Release Ringan
      - name: Build APK (Release - Ringan)
        working-directory: ./mobile
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 -Pandroid.initScript=android/init.gradle

      # 8. Bersihkan Cache
      - name: Clean Up Caches
        working-directory: ./mobile
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf build/app/intermediates/
          rm -rf android/.gradle/
          rm -f android/release-key.jks
          rm -f android/key.properties
          echo "Pembersihan selesai."

      # 9. Upload HANYA file Release
      - name: Upload APK (Release Only)
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-APK-Ringan
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
