name: Build StockFlow APK

on:
  push:
    branches: [ main, master ] # Akan berjalan otomatis jika kamu push ke branch main/master
  workflow_dispatch: # Menambahkan tombol agar bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # Sesuaikan dengan versi Flutter yang kamu pakai (bisa dicek di pubspec.yaml)
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ./mobile # Karena project flutter ada di dalam folder mobile
        run: flutter pub get

      - name: Build APK (Debug)
        working-directory: ./mobile
        run: flutter build apk --debug
        # Catatan: Kita pakai --debug dulu agar tidak perlu setting keystore release.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-APK
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
